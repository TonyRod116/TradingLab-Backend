<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Test Profile Frontend</title>
</head>
<body>
    <h1>Test Profile Frontend</h1>
    <div id="profile-info"></div>
    
    <script>
        // Simular la petición que hace el frontend
        async function testProfileLoad() {
            try {
                // Obtener token (simulamos que ya tenemos uno)
                const token = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJ0b2tlbl90eXBlIjoiYWNjZXNzIiwiZXhwIjoxNzU4MzI1MDQyLCJpYXQiOjE3NTgyMzg2NDIsImp0aSI6IjQ1YjBkNjcxYThhODRjZjg5MmFhODdiZTg0M2NjZjJlIiwidXNlcl9pZCI6IjEifQ.Xyd7L1IaurdoVLZq9xKXb8BUAlrVnI2rW_esPpk7YJ4';
                
                console.log('🔍 Testing profile load...');
                
                const response = await fetch('http://localhost:8000/api/users/profile/', {
                    headers: {
                        'Authorization': `Bearer ${token}`,
                        'Content-Type': 'application/json'
                    }
                });
                
                console.log('🔍 Response status:', response.status);
                console.log('🔍 Response headers:', response.headers);
                
                if (response.ok) {
                    const data = await response.json();
                    console.log('🔍 Profile data:', data);
                    
                    document.getElementById('profile-info').innerHTML = `
                        <h2>Profile Data:</h2>
                        <p><strong>Username:</strong> ${data.username}</p>
                        <p><strong>Email:</strong> ${data.email}</p>
                        <p><strong>Bio:</strong> ${data.bio || 'No bio'}</p>
                        <p><strong>Profile Image:</strong> ${data.profile_image || 'No image'}</p>
                        <p><strong>Date Joined:</strong> ${data.date_joined}</p>
                    `;
                } else {
                    const errorText = await response.text();
                    console.error('🔍 Error response:', errorText);
                    document.getElementById('profile-info').innerHTML = `<p>Error: ${response.status} - ${errorText}</p>`;
                }
            } catch (error) {
                console.error('🔍 Fetch error:', error);
                document.getElementById('profile-info').innerHTML = `<p>Fetch error: ${error.message}</p>`;
            }
        }
        
        // Ejecutar test
        testProfileLoad();
    </script>
</body>
</html>
